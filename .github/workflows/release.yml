name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test test
      - name: Build binaries (web UI embedded)
        run: bun scripts/build-bin.ts "${GITHUB_REF_NAME}"
      - name: Ad-hoc sign
        run: for f in dist/ckanban-darwin-*; do codesign --force --sign - "$f"; done
      - name: Smoke test
        run: |
          ./dist/ckanban-darwin-arm64 --version
          test "$(./dist/ckanban-darwin-arm64 --version)" = "${GITHUB_REF_NAME#v}"
      - name: Checksums
        run: cd dist && shasum -a 256 ckanban-darwin-* > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/ckanban-darwin-arm64 dist/ckanban-darwin-x64 dist/SHA256SUMS --generate-notes --title "${GITHUB_REF_NAME}"
